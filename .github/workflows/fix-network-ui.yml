name: Fix network error visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-network-ui.yml'
      - 'app/src/main/java/com/iswan/trading/MainActivity.kt'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch visible data errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/iswan/trading/MainActivity.kt')
          s = p.read_text()

          s = s.replace(
              '    var prices by remember { mutableStateOf<Map<String, MarketQuote>>(emptyMap()) }\n',
              '    var prices by remember { mutableStateOf<Map<String, MarketQuote>>(emptyMap()) }\n    var marketError by remember { mutableStateOf<String?>(null) }\n'
          )
          s = s.replace(
              '            val next = repository.getPrices(markets.map { it.symbol })\n            if (next.isNotEmpty()) prices = next\n',
              '            val next = repository.getPrices(markets.map { it.symbol })\n            if (next.isNotEmpty()) prices = next\n            marketError = repository.lastError\n'
          )
          s = s.replace(
              '                            if (prices.isNotEmpty()) "● YAHOO • UPDATE 1s" else "● CONNECTING",\n                            color = Color.Gray\n',
              '                            when {\n                                marketError != null -> "● DATA ERROR"\n                                prices.isNotEmpty() -> "● YAHOO • UPDATE 1s"\n                                else -> "● CONNECTING"\n                            },\n                            color = if (marketError != null) Color.Red else Color.Gray\n'
          )
          s = s.replace(
              '                    when (screen) {\n',
              '                    if (marketError != null) {\n                        Text(\n                            "Data: ${marketError}",\n                            color = Color.Red,\n                            style = MaterialTheme.typography.bodySmall,\n                            modifier = Modifier.padding(horizontal = 14.dp, vertical = 2.dp)\n                        )\n                    }\n                    when (screen) {\n',
              1
          )
          s = s.replace(
              '    var candles by remember(symbol, timeframe) { mutableStateOf<List<Candle>>(emptyList()) }\n',
              '    var candles by remember(symbol, timeframe) { mutableStateOf<List<Candle>>(emptyList()) }\n    var candleError by remember(symbol, timeframe) { mutableStateOf<String?>(null) }\n'
          )
          s = s.replace(
              '            val next = repo.getCandles(symbol, "1d", timeframe.apiValue)\n            if (next.isNotEmpty()) candles = next\n',
              '            val next = repo.getCandles(symbol, "1d", timeframe.apiValue)\n            if (next.isNotEmpty()) candles = next\n            candleError = repo.lastError\n'
          )
          s = s.replace(
              '        Text("Yahoo Finance • TF ${timeframe.label} • refresh 1 detik", color = Color.Gray, style = MaterialTheme.typography.bodySmall)\n\n',
              '        Text("Yahoo Finance • TF ${timeframe.label} • refresh 1 detik", color = Color.Gray, style = MaterialTheme.typography.bodySmall)\n        candleError?.let { error ->\n            Text("Data candle: $error", color = Color.Red, style = MaterialTheme.typography.bodySmall)\n        }\n\n'
          )
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/iswan/trading/MainActivity.kt
          git diff --cached --quiet || git commit -m 'Show market data errors in Android UI'
          git push
