name: Fix analysis scoring

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-analysis.yml'
      - 'app/src/main/java/com/iswan/trading/MainActivity.kt'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch direction-specific scoring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/iswan/trading/MainActivity.kt')
          s = p.read_text()
          old = '''    val bullish = ema9 > ema21 && closes.last() > sma20 && (rsi == null || rsi < 70)\n    val bearish = ema9 < ema21 && closes.last() < sma20 && (rsi == null || rsi > 30)\n    val signal = when { bullish -> Signal.BUY; bearish -> Signal.SELL; else -> Signal.NEUTRAL }\n    val confidence = listOf(ema9 > ema21, closes.last() > sma20, rsi != null && rsi > 50).count { it } * 25\n    return AnalysisResult(signal, confidence, if (ema9 >= ema21) "BULLISH" else "BEARISH", rsi)'''
          new = '''    val last = closes.last()\n    val bullEma = ema9 > ema21\n    val bearEma = ema9 < ema21\n    val bullSma = last > sma20\n    val bearSma = last < sma20\n    val bullRsi = rsi?.let { it in 50.0..69.999 } ?: false\n    val bearRsi = rsi?.let { it in 30.001..50.0 } ?: false\n    val bullish = bullEma && bullSma && (rsi == null || rsi < 70)\n    val bearish = bearEma && bearSma && (rsi == null || rsi > 30)\n    val signal = when { bullish -> Signal.BUY; bearish -> Signal.SELL; else -> Signal.NEUTRAL }\n    val bullScore = listOf(bullEma to 40, bullSma to 35, bullRsi to 25).sumOf { (ok, weight) -> if (ok) weight else 0 }\n    val bearScore = listOf(bearEma to 40, bearSma to 35, bearRsi to 25).sumOf { (ok, weight) -> if (ok) weight else 0 }\n    val confidence = when (signal) {\n        Signal.BUY -> bullScore\n        Signal.SELL -> bearScore\n        Signal.NEUTRAL -> maxOf(bullScore, bearScore).coerceAtMost(49)\n    }\n    return AnalysisResult(signal, confidence, if (bullScore >= bearScore) "BULLISH" else "BEARISH", rsi)'''
          if old not in s:
              raise SystemExit('Target analysis block not found; no change made.')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/iswan/trading/MainActivity.kt
          git diff --cached --quiet || git commit -m 'Fix direction-specific analysis scoring'
          git push
