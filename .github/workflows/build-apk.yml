name: Build Iswan Trading APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Keep the release/build workflow deterministic and always build the current main source.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python backend syntax
        run: python -m compileall -q backend
      - name: Check Massive API access without blocking the APK build
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          key = os.environ.get("MASSIVE_API_KEY", "").strip()
          if not key:
              print("MASSIVE_API_KEY is not available to this workflow.", file=sys.stderr)
              sys.exit(1)

          endpoint = "https://api.massive.com/v2/last/trade/C:XAUUSD"
          url = endpoint + "?" + urllib.parse.urlencode({"apiKey": key})
          request = urllib.request.Request(
              url,
              headers={"Accept": "application/json", "User-Agent": "Iswan-Trading-CI/1.0"},
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read().decode("utf-8", errors="replace")
          except Exception as exc:
              print(f"Massive connectivity check failed: {type(exc).__name__}: {exc}", file=sys.stderr)
              sys.exit(1)

          try:
              payload = json.loads(body)
          except json.JSONDecodeError:
              payload = {}

          provider_status = str(payload.get("status", ""))
          message = str(payload.get("message", ""))

          if status == 200 and provider_status != "ERROR":
              print("Massive API connectivity check passed for XAUUSD. API key value is not printed.")
          elif provider_status == "NOT_AUTHORIZED" and "not entitled to this data" in message.lower():
              print("WARNING: Massive key is present, but the current plan is not entitled to XAUUSD data. APK build will continue.")
          elif status in (401, 403) or provider_status in {"NOT_AUTHORIZED", "ERROR"}:
              print("Massive rejected the request; APK build will continue, but live data may be unavailable until provider access is fixed.", file=sys.stderr)
              print(body[:4000], file=sys.stderr)
          else:
              print(f"Massive returned HTTP {status}; APK build will continue.")
              print(body[:1000])
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iswan-trading-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
