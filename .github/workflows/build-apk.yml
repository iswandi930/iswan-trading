name: Build Iswan Trading APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Keep the release/build workflow deterministic and always build the current main source.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python backend syntax
        run: python -m compileall -q backend
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iswan-trading-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
