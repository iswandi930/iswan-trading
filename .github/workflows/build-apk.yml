name: Build Iswan Trading APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# Keep the release/build workflow deterministic and always build the current main source.

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python backend syntax
        run: python -m compileall -q backend
      - name: Verify Massive secret and API connectivity
        run: |
          python - <<'PY'
          import os
          import sys
          import urllib.parse
          import urllib.request

          key = os.environ.get("MASSIVE_API_KEY", "").strip()
          if not key:
              print("MASSIVE_API_KEY is not available to this workflow.", file=sys.stderr)
              sys.exit(1)

          url = "https://api.massive.com/v2/last/trade/C:XAUUSD?" + urllib.parse.urlencode({"apiKey": key})
          request = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "Iswan-Trading-CI/1.0"})
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  status = response.status
                  body = response.read().decode("utf-8", errors="replace")
          except Exception as exc:
              print(f"Massive connectivity check failed: {exc}", file=sys.stderr)
              sys.exit(1)

          if status != 200:
              print(f"Massive returned HTTP {status}.", file=sys.stderr)
              sys.exit(1)

          if '"status":"ERROR"' in body or '"status": "ERROR"' in body:
              print("Massive rejected the API request.", file=sys.stderr)
              sys.exit(1)

          print("Massive API connectivity check passed for XAUUSD. API key value is not printed.")
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iswan-trading-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
